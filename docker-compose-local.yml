version: '3'

x-postgres-common:
  &postgres-common
  image: postgres:17.7
  user: postgres
  restart: always
  healthcheck:
    test: 'pg_isready -U postgres_user --dbname=postgres'
    interval: 10s
    timeout: 5s
    retries: 5

services:
  # postgres:
  #   image: postgres:17.7
  #   container_name: postgres-skeleton
  #   volumes:
  #     - database:/data/postgres:/data/postgres
  #   env_file:
  #     - .env
  #   ports:
  #     - '5432:5432'

  postgres_primary:
    <<: *postgres-common
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256\nhost replication all 0.0.0.0/0 md5"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command: |
      postgres 
      -c wal_level=replica 
      -c hot_standby=on 
      -c max_wal_senders=10 
      -c max_replication_slots=10 
      -c hot_standby_feedback=on
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./00_init.sql:/docker-entrypoint-initdb.d/00_init.sql

  postgres_replica:
    <<: *postgres-common
    ports:
      - 5433:5432
    environment:
      PGUSER: replicator
      PGPASSWORD: replicator_password
    # command: |
    #   bash -c "
    #   until pg_basebackup --pgdata=/var/lib/postgresql/data -R --slot=replication_slot --host=postgres_primary --port=5432
    #   do
    #   echo 'Waiting for primary to connect...'
    #   sleep 1s
    #   done
    #   echo 'Backup done, starting replica...'
    #   chmod 0700 /var/lib/postgresql/data
    #   postgres
    #   "
    command: |
      bash -c "
      set -e
      if [ -s /var/lib/postgresql/data/PG_VERSION ]; then
        echo 'Existing replica data found, starting postgres...'
        exec postgres
      fi
      echo 'No replica data found, running base backup...'
      until pg_basebackup \
        --pgdata=/var/lib/postgresql/data \
        -R \
        --slot=replication_slot \
        --host=postgres_primary \
        --port=5432
      do
        echo 'Waiting for primary to connect...'
        sleep 1
      done
      chmod 0700 /var/lib/postgresql/data
      echo 'Backup done, starting replica...'
      exec postgres
      "
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    depends_on:
      - postgres_primary

  cache:
    image: redis:8.6.1-alpine
    container_name: cache-skeleton
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - cache:/data

volumes:
  # database:
  postgres_primary_data:
  postgres_replica_data:
  cache:
    driver: local
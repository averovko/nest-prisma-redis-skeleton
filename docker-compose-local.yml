version: '3'
services:
  postgres:
    image: postgres:17.7
    container_name: postgres-skeleton
    volumes:
      - database:/data/postgres:/data/postgres
    env_file:
      - .env
    ports:
      - '5432:5432'

  cache:
    image: redis:8.6.1-alpine
    container_name: cache-skeleton
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - cache:/data

volumes:
  database:
  cache:
    driver: local